    <script>
      // Suppress Vite HMR WebSocket disconnect noise in sandbox iFrame environment
      window.addEventListener('error', function(event) {
        if (event && event.message && (event.message.includes('WebSocket') || event.message.includes('vite'))) {
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && String(event.reason).includes('WebSocket')) {
          event.stopImmediatePropagation();
        }
      });
    </script>
