<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="6" opacity="0.4"/>

  <!-- Energy Grid Circles -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Stylized Green Clean Leaf Motif -->
  <path d="M 170,350 C 140,240 210,140 350,130 C 370,260 290,360 170,350 Z" 
        fill="url(#leafGrad)" filter="url(#glow)"/>

  <!-- Leaf Central Vein -->
  <path d="M 175,345 C 230,280 280,210 345,135" 
        fill="none" stroke="#020617" stroke-width="8" stroke-linecap="round"/>

  <!-- Electric Energy Bolt Overlay -->
  <polygon points="280,180 230,270 270,270 235,350 305,250 265,250" 
           fill="url(#boltGrad)" filter="url(#glow)"/>

  <!-- Microgrid Tech Nodes -->
  <circle cx="160" cy="190" r="10" fill="#38bdf8"/>
  <line x1="160" y1="190" x2="200" y2="220" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>

  <circle cx="360" cy="320" r="10" fill="#34d399"/>
  <line x1="360" y1="320" x2="310" y2="300" stroke="#34d399" stroke-width="3" opacity="0.6"/>
</svg>
